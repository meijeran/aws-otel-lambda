name: Sync with upstream

# Weekly agentic sync: checks aws-observability/aws-otel-lambda for new commits
# on main and, if any are found, opens a pull request against this fork's main
# branch for human approval. Nothing is ever pushed directly to main - the PR
# Build workflow (.github/workflows/pr-build.yml) runs automatically against
# the PR so tests must succeed before a reviewer approves/merges it.
#
# Required secret:
#   SYNC_PAT - a personal access token (repo scope) used instead of the
#              default GITHUB_TOKEN. This is required so the PR this workflow
#              opens actually triggers the PR Build workflow - GitHub does not
#              trigger other workflows for pull requests created with the
#              default GITHUB_TOKEN.

on:
    schedule:
        - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
    workflow_dispatch:

jobs:
    sync:
        name: Sync fork main with upstream
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout fork
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ secrets.SYNC_PAT }}

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Add upstream remote
              run: git remote add upstream https://github.com/aws-observability/aws-otel-lambda.git

            - name: Fetch upstream
              run: git fetch upstream

            - name: Check for new upstream commits
              id: check
              run: |
                  BEHIND=$(git rev-list --count HEAD..upstream/main)
                  echo "behind=$BEHIND" >> $GITHUB_OUTPUT
                  echo "Commits behind upstream: $BEHIND"

            - name: Create sync branch and merge upstream
              if: steps.check.outputs.behind != '0'
              id: merge
              run: |
                  BRANCH="sync/upstream-$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
                  echo "branch=$BRANCH" >> $GITHUB_OUTPUT
                  git checkout -b "$BRANCH"

                  if git merge --ff-only upstream/main; then
                    echo "clean=true" >> $GITHUB_OUTPUT
                  else
                    git merge --no-ff upstream/main -m "chore: sync with upstream $(date +%Y-%m-%d)" || true
                    if git diff --name-only --diff-filter=U | grep -q .; then
                      git add -A
                      git commit --no-edit
                      echo "clean=false" >> $GITHUB_OUTPUT
                    else
                      echo "clean=true" >> $GITHUB_OUTPUT
                    fi
                  fi

                  git push origin "$BRANCH"

            - name: Open PR for review
              if: steps.check.outputs.behind != '0'
              run: |
                  if [ "${{ steps.merge.outputs.clean }}" = "true" ]; then
                    BODY="Automated weekly sync from [aws-observability/aws-otel-lambda](https://github.com/aws-observability/aws-otel-lambda) (${{ steps.check.outputs.behind }} commit(s) behind).

                  Merged cleanly. The PR Build workflow will run the test suite against this branch - please confirm it succeeds before approving and merging."
                  else
                    BODY="Automated weekly sync from [aws-observability/aws-otel-lambda](https://github.com/aws-observability/aws-otel-lambda) (${{ steps.check.outputs.behind }} commit(s) behind).

                  ⚠️ Merge conflicts were detected and committed with conflict markers left in place - please resolve them before merging. Do not merge until the PR Build workflow succeeds."
                  fi

                  gh pr create \
                    --title "chore: sync with upstream $(date +%Y-%m-%d)" \
                    --body "$BODY" \
                    --base main \
                    --head "${{ steps.merge.outputs.branch }}"
              env:
                  GH_TOKEN: ${{ secrets.SYNC_PAT }}

            - name: No changes
              if: steps.check.outputs.behind == '0'
              run: echo "Already up to date with upstream."
